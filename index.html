<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation and Preferences Demo</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f5f5f5;
            --text-color: #333;
            --accent-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.5s ease, color 0.5s ease;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        body.dark-theme {
            --background-color: #333;
            --text-color: #f5f5f5;
            --primary-color: #5dade2;
            --secondary-color: #58d68d;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-theme .container {
            background-color: #444;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .theme-toggle {
            background-color: var(--secondary-color);
        }

        .animation-box {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            margin: 30px auto;
            position: relative;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        /* Predefined animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .bounce {
            animation: bounce 1s ease infinite;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        .pulse {
            animation: pulse 1s ease infinite;
        }

        .shake {
            animation: shake 0.5s ease infinite;
        }

        .preferences {
            margin-top: 30px;
            width: 100%;
        }

        .color-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .color-option:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .color-option.selected {
            border: 3px solid white;
            box-shadow: 0 0 0 2px #333;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 5px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            text-align: center;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in {
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-color);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <h1>CSS3 Animations & LocalStorage Demo</h1>
        
        <div class="controls">
            <button id="themeToggle" class="theme-toggle">Toggle Dark Mode</button>
            <button id="resetPrefs">Reset Preferences</button>
        </div>
        
        <div class="animation-box" id="animationBox"></div>
        
        <div class="controls">
            <button data-animation="bounce">Bounce</button>
            <button data-animation="spin">Spin</button>
            <button data-animation="pulse">Pulse</button>
            <button data-animation="shake">Shake</button>
            <button data-animation="none">Stop</button>
        </div>
        
        <div class="preferences">
            <h2>Color Preferences</h2>
            <p>Select your favorite color scheme (saved in localStorage):</p>
            <div class="color-options">
                <div class="color-option" style="background-color: #3498db;" data-color="blue"></div>
                <div class="color-option" style="background-color: #2ecc71;" data-color="green"></div>
                <div class="color-option" style="background-color: #e74c3c;" data-color="red"></div>
                <div class="color-option" style="background-color: #9b59b6;" data-color="purple"></div>
                <div class="color-option" style="background-color: #f39c12;" data-color="orange"></div>
            </div>
        </div>
        
        <div class="message" id="message">Preferences saved!</div>
    </div>
    
    <footer>
        <p>CSS3 Transitions, Animations & JavaScript Demo</p>
    </footer>

    <script>
        // DOM Elements
        const themeToggle = document.getElementById('themeToggle');
        const resetPrefs = document.getElementById('resetPrefs');
        const animationBox = document.getElementById('animationBox');
        const animationButtons = document.querySelectorAll('button[data-animation]');
        const colorOptions = document.querySelectorAll('.color-option');
        const message = document.getElementById('message');
        
        // User preferences object
        const userPreferences = {
            theme: 'light',
            color: 'blue',
            animation: 'none',
            
            // Save to localStorage
            save: function() {
                localStorage.setItem('userPreferences', JSON.stringify({
                    theme: this.theme,
                    color: this.color,
                    animation: this.animation
                }));
                showMessage('Preferences saved!');
            },
            
            // Load from localStorage
            load: function() {
                const saved = localStorage.getItem('userPreferences');
                if (saved) {
                    const prefs = JSON.parse(saved);
                    this.theme = prefs.theme || 'light';
                    this.color = prefs.color || 'blue';
                    this.animation = prefs.animation || 'none';
                    return true;
                }
                return false;
            },
            
            // Apply preferences to UI
            apply: function() {
                // Apply theme
                document.body.classList.toggle('dark-theme', this.theme === 'dark');
                
                // Apply color
                applyColorScheme(this.color);
                
                // Highlight selected color option
                colorOptions.forEach(option => {
                    option.classList.toggle('selected', option.dataset.color === this.color);
                });
                
                // Apply animation
                applyAnimation(this.animation);
            }
        };

        // Animation control function
        function applyAnimation(animationType) {
            animationBox.className = 'animation-box';
            if (animationType !== 'none') {
                animationBox.classList.add(animationType);
            }
            
            // Update active button state
            animationButtons.forEach(btn => {
                btn.style.opacity = btn.dataset.animation === animationType ? '1' : '0.8';
                btn.style.fontWeight = btn.dataset.animation === animationType ? 'bold' : 'normal';
            });
        }
        
        // Color scheme function
        function applyColorScheme(color) {
            let primaryColor, secondaryColor, accentColor;
            
            switch(color) {
                case 'green':
                    primaryColor = '#2ecc71';
                    secondaryColor = '#27ae60';
                    accentColor = '#e67e22';
                    break;
                case 'red':
                    primaryColor = '#e74c3c';
                    secondaryColor = '#c0392b';
                    accentColor = '#3498db';
                    break;
                case 'purple':
                    primaryColor = '#9b59b6';
                    secondaryColor = '#8e44ad';
                    accentColor = '#f1c40f';
                    break;
                case 'orange':
                    primaryColor = '#f39c12';
                    secondaryColor = '#d35400';
                    accentColor = '#3498db';
                    break;
                default: // blue
                    primaryColor = '#3498db';
                    secondaryColor = '#2980b9';
                    accentColor = '#e74c3c';
            }
            
            document.documentElement.style.setProperty('--primary-color', primaryColor);
            document.documentElement.style.setProperty('--secondary-color', secondaryColor);
            document.documentElement.style.setProperty('--accent-color', accentColor);
        }
        
        // Show notification message
        function showMessage(text) {
            message.textContent = text;
            message.classList.add('show');
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }
        
        // Event Listeners
        themeToggle.addEventListener('click', () => {
            userPreferences.theme = userPreferences.theme === 'light' ? 'dark' : 'light';
            userPreferences.apply();
            userPreferences.save();
        });
        
        resetPrefs.addEventListener('click', () => {
            localStorage.removeItem('userPreferences');
            userPreferences.theme = 'light';
            userPreferences.color = 'blue';
            userPreferences.animation = 'none';
            userPreferences.apply();
            showMessage('Preferences reset!');
        });
        
        animationButtons.forEach(button => {
            button.addEventListener('click', () => {
                const animationType = button.dataset.animation;
                userPreferences.animation = animationType;
                userPreferences.apply();
                userPreferences.save();
            });
        });
        
        colorOptions.forEach(option => {
            option.addEventListener('click', () => {
                const color = option.dataset.color;
                userPreferences.color = color;
                userPreferences.apply();
                userPreferences.save();
            });
        });
        
        // On page load
        document.addEventListener('DOMContentLoaded', () => {
            // Try to load saved preferences
            if (userPreferences.load()) {
                showMessage('Loaded your preferences!');
            }
            
            // Apply preferences to UI
            userPreferences.apply();
        });
    </script>
</body>
</html>
